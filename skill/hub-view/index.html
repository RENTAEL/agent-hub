<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub Live</title>
<style>
:root{
  --bg:#070a12; --panel:rgba(18,24,40,.62); --line:rgba(148,163,184,.14); --text:#e5e9f2; --dim:#8b95ab;
  --claude:#e8875f; --opencode:#38bdf8; --ollama:#a3e635; --omniroute:#c084fc; --other:#94a3b8;
  --open:#94a3b8; --working:#fbbf24; --answered:#38bdf8; --failed:#f87171; --done:#4ade80;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
.aurora{position:fixed;inset:-20%;z-index:-2;filter:blur(90px);opacity:.55;pointer-events:none}
.aurora i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#1e3a8a;left:-5%;top:0}
.aurora i:nth-child(2){background:#581c87;right:0;top:10%;animation-duration:32s}
.aurora i:nth-child(3){background:#0e7490;left:30%;bottom:-10%;animation-duration:38s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);opacity:.5}
header{display:flex;align-items:center;gap:18px;padding:18px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:650;font-size:20px;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 0deg,var(--claude),var(--opencode),var(--ollama),var(--omniroute),var(--claude));animation:spin 8s linear infinite;position:relative}
.logo::after{content:"";position:absolute;inset:4px;border-radius:7px;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);padding:4px 10px;border:1px solid var(--line);border-radius:99px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--done);box-shadow:0 0 0 0 var(--done);animation:beat 1.6s infinite}
.live.off b{background:var(--failed);animation:none}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px;min-width:92px;backdrop-filter:blur(12px)}
.stat span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.stat strong{font-size:22px;font-variant-numeric:tabular-nums}
.clock{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:0 24px 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.panel h2{margin:0;padding:14px 18px 6px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#map svg{width:100%;height:auto;max-height:58vh;display:block;margin:0 auto}
.node-label{font-size:13px;font-weight:650;fill:#f4f6fb;letter-spacing:.2px}
.node-done{font-size:9.5px;fill:#c3cad8;font-variant-numeric:tabular-nums}
.node-sub{font-size:10px;fill:var(--dim);letter-spacing:.6px;text-transform:uppercase}
.pill-t{font-size:10.5px;font-weight:650}
.orbit{fill:none;stroke:rgba(148,163,184,.13);stroke-width:1;stroke-dasharray:2 7}
.radar{fill:none;stroke:rgba(232,135,95,.10)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:52s}
.ring{transform-box:fill-box;transform-origin:center;opacity:0}
.ring.on{animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.core{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 5s ease-in-out infinite}
@keyframes halo{50%{opacity:.55}}
.arc{fill:none;stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.wire{fill:none;stroke-width:2.2;opacity:.38;transition:opacity .4s}
.wire.hot{opacity:.95}
.flow{fill:none;stroke:#fff;stroke-width:1.2;stroke-dasharray:2 10;opacity:0;animation:dash 1s linear infinite;transition:opacity .4s}
.flow.hot{opacity:.55}
@keyframes dash{to{stroke-dashoffset:-24}}
.down{opacity:.35;filter:grayscale(1)}
/* team map seats: idle dim, work bright + pulse, bad red, off grey hollow */
.seat{cursor:pointer;outline:none}
.seat .d{opacity:.42;transition:opacity .4s,fill .4s}
.seat .p{transform-box:fill-box;transform-origin:center;opacity:0;pointer-events:none}
.seat.work .d{opacity:1;filter:url(#glow)}
.seat.work .p{animation:ring 1.4s ease-out infinite}
.seat.bad .d{fill:#f87171;opacity:.95}
.seat.off .d{fill:none;stroke:#64748b;stroke-width:1.2;opacity:.9}
.seat:hover .d,.seat:focus-visible .d,.seat.sel .d{opacity:1;stroke:#fff;stroke-width:1.4}
.ag{cursor:pointer;outline:none}
.ag .d{transition:opacity .4s}
.ag.stop .d{opacity:.25}
.ag.run .d{filter:url(#glow)}
.ag.run .p{animation:ring 1.6s ease-out infinite}
.ag:hover .d,.ag:focus-visible .d{opacity:1;stroke:#fff;stroke-width:1.2}
.tie{stroke-width:1;stroke-dasharray:3 5;opacity:.6;animation:dash 1s linear infinite;pointer-events:none}
.c-name{font-size:11px;font-weight:650;letter-spacing:.3px}
.c-meta{font-size:9.5px;fill:var(--dim);font-variant-numeric:tabular-nums}
.c-empty{font-size:12px;fill:var(--dim)}
#tip{position:fixed;z-index:8;pointer-events:none;display:none;max-width:320px;background:rgba(10,13,24,.96);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;white-space:pre-line;word-break:break-word}
.lv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim);margin:0 0 10px}
.lv-err{color:var(--failed);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);border-radius:9px;padding:8px 10px;font-size:12px;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.lv-h{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.lv-box{margin:0;background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:34vh;min-height:48px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.5 Consolas,"Cascadia Code",monospace}
.lv-box.think{color:#aab3c5;max-height:24vh}
/* contain:size lets the feed take the map's height instead of growing the row; the list scrolls inside it. */
#feed{display:flex;flex-direction:column;contain:size}
#feedList{list-style:none;margin:0;padding:6px 12px 14px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
#feedList li{display:flex;gap:10px;align-items:flex-start;padding:8px 8px;border-radius:10px;animation:slide .5s cubic-bezier(.2,.8,.2,1) both;cursor:pointer}
#feedList li:hover{background:rgba(255,255,255,.04)}
@keyframes slide{from{opacity:0;transform:translateX(18px)}}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.feed-t{font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap}
.board-wrap{grid-column:1/-1}
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:6px 14px 16px}
.col{min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:4px 4px 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.col-h em{font-style:normal;margin-left:auto;background:rgba(255,255,255,.06);padding:1px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:9px;max-height:560px;overflow:auto;padding:2px 4px 4px 2px}
.card{position:relative;background:rgba(10,14,26,.72);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 15px;cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .25s}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--a)}
.card.new{animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
.card .t{font-weight:600;font-size:13px;line-height:1.3;word-break:break-word}
.card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
.tag{padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.06);white-space:nowrap}
.tag.agent{color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.tag.local{color:var(--ollama)}
.card .p{margin-top:6px;font-size:11.5px;color:#aab3c5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.working{border-color:rgba(251,191,36,.35)}
.card.working::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:0 0 12px 12px;background:linear-gradient(90deg,transparent,var(--working),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:scan 1.3s linear infinite}
@keyframes scan{from{background-position:-50% 0}to{background-position:150% 0}}
.card.answered{box-shadow:0 0 0 1px rgba(56,189,248,.35),0 0 22px -6px rgba(56,189,248,.6);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(56,189,248,.15),0 0 10px -6px rgba(56,189,248,.3)}}
.card.failed{border-color:rgba(248,113,113,.45)}
.more{font-size:12px;color:var(--dim);text-align:center;padding:6px}
.empty{font-size:12px;color:var(--dim);text-align:center;padding:22px 6px;border:1px dashed var(--line);border-radius:12px}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(720px,100%);background:rgba(10,13,24,.97);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:10;display:flex;flex-direction:column;backdrop-filter:blur(18px)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .35s;z-index:9}
#scrim.open{opacity:1;pointer-events:auto}
.d-head{padding:18px 22px 10px;border-bottom:1px solid var(--line)}
.d-head h3{margin:0 0 8px;font-size:17px}
.d-close{position:absolute;right:16px;top:14px;background:none;border:1px solid var(--line);color:var(--text);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:6px;padding:10px 22px 0}
.tabs button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 14px;border-radius:9px;cursor:pointer;font:inherit}
.tabs button.on{color:var(--text);border-color:var(--line);background:rgba(255,255,255,.05)}
.d-body{padding:14px 22px 30px;overflow:auto;flex:1}
.md{animation:rise .35s both}
.md pre{background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:12px/1.5 Consolas,"Cascadia Code",monospace}
.md code{font:12px Consolas,"Cascadia Code",monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
.md pre code{background:none;padding:0}
.md h1,.md h2,.md h3,.md h4{font-size:14px;margin:16px 0 6px}
.md blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--answered);background:rgba(56,189,248,.06);border-radius:0 8px 8px 0}
.md blockquote.fail{border-color:var(--failed);background:rgba(248,113,113,.07)}
.md table{border-collapse:collapse;font-size:12px;margin:8px 0;display:block;overflow:auto}
.md td,.md th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md ul{padding-left:20px}
.hint{color:var(--dim);font-size:12px}
footer{padding:0 24px 22px;color:var(--dim);font-size:12px}
@media (max-width:1000px){main{grid-template-columns:1fr}#feed{contain:none}#feedList{max-height:380px}#board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){header,main,footer{padding-left:16px;padding-right:16px}#board{grid-template-columns:1fr}.stats{margin-left:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid"></div>
<header>
  <div class="brand"><div class="logo"></div>Agent Hub</div>
  <span class="live" id="live"><b></b><span id="liveTxt">connecting</span></span>
  <div class="stats" id="stats"></div>
  <span class="clock" id="clock"></span>
</header>
<main>
  <section class="panel" id="map" style="animation-delay:.05s"><h2 id="mapTitle">Team map · Claude leads, the seats answer</h2><svg viewBox="0 0 640 450" id="svg" role="group" aria-label="Claude, its subagents and the agent seats by provider"></svg></section>
  <section class="panel" id="feed" style="animation-delay:.12s"><h2>Live activity</h2><ul id="feedList"></ul></section>
  <section class="panel board-wrap" style="animation-delay:.2s"><h2>Task board · cards move as agents work</h2><div id="board"></div></section>
</main>
<footer>Reads <code>agents/tasks</code> in the Obsidian vault. Replies are untrusted until Claude's verdict. This page only reads; it never changes a note.</footer>
<div id="tip" role="tooltip"></div>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <button class="d-close" id="dClose" aria-label="Close">✕</button>
  <div class="d-head"><h3 id="dTitle"></h3><div class="card" style="all:unset"><div class="m" id="dMeta"></div></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="d-body" id="dBody"></div>
</aside>
<script>
const AG = {
  // The three agents sit evenly on an orbit (ellipse rx 175, ry 120) around Claude.
  claude:   { name:'Claude',    color:'var(--claude)',    hex:'#e8875f', x:320, y:205, sub:'lead · reviews and tests' },
  opencode: { name:'OpenCode',  color:'var(--opencode)',  hex:'#38bdf8', x:168, y:145, sub:'cloud · free 1M-context' },
  omniroute:{ name:'OmniRoute', color:'var(--omniroute)', hex:'#c084fc', x:472, y:145, sub:'cloud · model gateway' },
  ollama:   { name:'Ollama',    color:'var(--ollama)',    hex:'#a3e635', x:320, y:325, sub:'local · stays on this PC' },
};
const COLS = [
  { key:'open', label:'Queued', match:s=>s==='open' },
  { key:'working', label:'Working', match:s=>s==='working' },
  { key:'answered', label:'Awaiting Claude', match:s=>s==='answered'||s==='failed' },
  { key:'done', label:'Done · verdict written', match:s=>s==='done' },
];
const STATUS_COLOR = { open:'var(--open)', working:'var(--working)', answered:'var(--answered)', failed:'var(--failed)', done:'var(--done)', new:'var(--open)' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const agentColor = (a) => (AG[a] || {}).color || 'var(--other)';
const ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${s|0}s ago` : s < 3600 ? `${(s/60)|0}m ago` : s < 86400 ? `${(s/3600)|0}h ago` : `${(s/86400)|0}d ago`; };
let state = { list:[], events:[], health:{} };

/* ---------- team map ---------- */
// Claude in the centre, its own subagents on a close orbit, and one hex-packed cluster of seats per provider around it.
const NS = 'http://www.w3.org/2000/svg';
const svg = $('svg');
const mk = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const C = { x:320, y:222, hex:'#e8875f', r:44 };
// Order around Claude; the OmniRoute family sits together in shades of its purple.
const PROV = {
  openrouter:{ name:'OpenRouter', hex:'#c084fc' }, cfp:{ name:'Cloudflare', hex:'#a78bfa' }, groq:{ name:'Groq', hex:'#e879f9' },
  gemini:{ name:'Gemini', hex:'#d8b4fe' }, ddgw:{ name:'DuckDuckGo', hex:'#f0abfc' }, ollama:{ name:'Ollama', hex:'#a3e635' }, opencode:{ name:'OpenCode', hex:'#38bdf8' },
};
const provOf = (p) => PROV[p] || { name:p, hex:'#94a3b8' };
const defs = mk('defs', {});
const glow = mk('filter', { id:'glow', x:'-60%', y:'-60%', width:'220%', height:'220%' }, defs);
mk('feGaussianBlur', { stdDeviation:'2.2', result:'b' }, glow);
const merge = mk('feMerge', {}, glow); mk('feMergeNode', { in:'b' }, merge); mk('feMergeNode', { in:'SourceGraphic' }, merge);
const soft = mk('filter', { id:'soft', x:'-100%', y:'-100%', width:'300%', height:'300%' }, defs);
mk('feGaussianBlur', { stdDeviation:'14' }, soft);
const cgrad = mk('radialGradient', { id:'g-claude', cx:'35%', cy:'30%', r:'75%' }, defs);
[['0%', '.9'], ['55%', '.35'], ['100%', '.12']].forEach(([o, a]) => mk('stop', { offset:o, 'stop-color':C.hex, 'stop-opacity':a }, cgrad));
mk('circle', { cx:C.x, cy:C.y, r:120, fill:C.hex, opacity:.07, filter:'url(#soft)' });
mk('circle', { cx:C.x, cy:C.y, r:110, class:'radar' });
const tieLayer = mk('g', {});
const particleLayer = mk('g', { filter:'url(#glow)' });
const clusterLayer = mk('g', {});
// Claude: same look as before (halo, review ring, two counter-rotating orbits, core, pill).
const cg = mk('g', { transform:`translate(${C.x},${C.y})` });
mk('circle', { r:C.r + 14, fill:C.hex, opacity:.28, filter:'url(#soft)', class:'halo' }, cg);
const cRing = mk('circle', { r:C.r, fill:'none', stroke:C.hex, 'stroke-width':2, class:'ring' }, cg);
mk('circle', { r:C.r + 9, fill:'none', stroke:C.hex, 'stroke-opacity':.55, 'stroke-width':1.5, 'stroke-dasharray':'14 10', class:'spin' }, cg);
mk('circle', { r:C.r + 15, fill:'none', stroke:C.hex, 'stroke-opacity':.25, 'stroke-width':1, 'stroke-dasharray':'2 6', class:'spin rev' }, cg);
mk('circle', { r:C.r, fill:'url(#g-claude)', class:'core' }, cg);
mk('circle', { r:C.r - 7, fill:'#0a0f1c', opacity:.6 }, cg);
mk('circle', { r:C.r - 7, fill:'none', stroke:'rgba(255,255,255,.12)' }, cg);
mk('text', { y:2, 'text-anchor':'middle', class:'node-label' }, cg).textContent = 'Claude';
const cDone = mk('text', { y:17, 'text-anchor':'middle', class:'node-done' }, cg);
const cPill = mk('rect', { y:-C.r - 41, height:17, rx:8.5, fill:C.hex, 'fill-opacity':.14, stroke:C.hex, 'stroke-opacity':.45 }, cg);
const cCnt = mk('text', { y:-C.r - 29, 'text-anchor':'middle', class:'pill-t', fill:C.hex }, cg);
const cTip = mk('title', {}, cg);
// Claude's own subagents: a slow orbit just outside its rings. The invisible circle keeps the spin centred on Claude.
const SUB_R = 66;
const subOrbit = mk('g', { class:'spin' }, cg);
mk('circle', { r:SUB_R, fill:'none', stroke:'rgba(232,135,95,.16)', 'stroke-dasharray':'1 5' }, subOrbit);
function setPill(text) {
  if (cCnt.textContent === text && cPill.getAttribute('width')) return;
  cCnt.textContent = text;
  const w = cCnt.getComputedTextLength() + 18;
  cPill.setAttribute('width', w.toFixed(1)); cPill.setAttribute('x', (-w / 2).toFixed(1));
}
// Notes still drive Claude's pill and verdict count.
function renderMap() {
  const review = state.list.filter((n) => n.status === 'answered' || n.status === 'failed').length;
  cRing.classList.toggle('on', review > 0);
  setPill(review ? `${review} to review` : 'all reviewed');
  cDone.textContent = `${state.list.filter((n) => n.hasVerdict).length} verdicts`;
  cTip.textContent = `Claude: ${(state.health.claude || {}).detail || ''}`;
}

let team = { seats:[], claude:[] };
const seatEls = new Map(); // id -> { g, x, y, hex, cluster }
const ties = new Map();    // working seat id -> { line, dot, t, speed }
let layoutKey = null, agKey = ''; // null so an empty team still lays out once (shows the hint)
let openSeat = null, liveES = null; // the seat drawer and its live stream
const ACTIVE = new Set(['thinking', 'writing']);
function seatState(s, now) {
  const lv = s.live;
  if (lv && ACTIVE.has(lv.status) && now - (lv.updated || 0) < 300000) return 'work';
  if (!s.ok) return 'off';
  if (s.downUntil > now || (lv && lv.status === 'failed' && now - (lv.updated || 0) < 600000)) return 'bad';
  return 'idle';
}
// Hex packing: centre, then rings of 6k dots.
function hexPts(n, s) {
  const pts = [[0, 0]], dir = [...Array(6)].map((_, i) => [Math.cos(-i * Math.PI / 3) * s, Math.sin(-i * Math.PI / 3) * s]);

    let x = dir[4][0] * k, y = dir[4][1] * k;
    for (let i = 0; i < 6; i++) for (let j = 0; j < k; j++) { pts.push([x, y]); x += dir[i][0]; y += dir[i][1]; }

}
const clusters = new Map(); // provider -> { g, meta, seats:[ids] }

  const order = [...Object.keys(PROV).filter((p) => by.has(p)), ...[...by.keys()].filter((p) => !PROV[p]).sort()];
  if (!order.length) { mk('text', { x:C.x, y:C.y + 120, 'text-anchor':'middle', class:'c-empty' }, clusterLayer).textContent = 'No team built yet: run team.mjs --build'; return; }

  const big = Math.max(...order.map((p) => by.get(p).length)), rings = Math.ceil((Math.sqrt(12 * big - 3) - 3) / 6);
  const S = Math.max(6, Math.min(12, 52 / Math.max(rings, 1))), DR = S * .32;
  order.forEach((p, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * (i + .5) / order.length;
    const cx = C.x + Math.cos(a) * 236, cy = C.y + Math.sin(a) * 148;
    const list = by.get(p).sort((x, y) => (y.ok - x.ok) || x.id.localeCompare(y.id));
    const pts = hexPts(list.length, S), R = Math.max(...pts.map(([x, y]) => Math.hypot(x, y))) + 4;
    const pv = provOf(p);
    const g = mk('g', { class:'cluster' }, clusterLayer);
    mk('circle', { cx, cy, r:R + 6, fill:pv.hex, 'fill-opacity':.05, stroke:pv.hex, 'stroke-opacity':.18 }, g);
    list.forEach((s, j) => {
      const x = cx + pts[j][0], y = cy + pts[j][1];
      const sg = mk('g', { class:'seat idle', 'data-seat':s.id, tabindex:0, role:'button', 'aria-label':`${s.model} on ${pv.name}` }, g);
      mk('circle', { cx:x, cy:y, r:S / 2, fill:'transparent' }, sg); // hit area
      mk('circle', { cx:x, cy:y, r:DR + .5, fill:'none', stroke:pv.hex, 'stroke-width':1.2, class:'p' }, sg);
      mk('circle', { cx:x, cy:y, r:DR, fill:pv.hex, class:'d' }, sg);
      seatEls.set(s.id, { g:sg, x, y, hex:pv.hex, p });

    const up = Math.sin(a) < 0, ly = up ? cy - R - 22 : cy + R + 16;

const cardEls = new Map();
const LIMIT = 30;
function cardHTML(n) {

  return `<div class="t">${esc(n.group)}</div>

function renderBoard() {

function md(src) {

    if (/^\s*[-*] /.test(l)) { const buf = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) buf.push(lines[i++].replace(/^\s*[-*] /, '')); out.push('<ul>' + buf.map((b) => `<li>${inline(b)}</li>`).join('') + '</ul>'); continue; }
    const h = l.match(/^(#{1,4}) (.*)/); if (h) { out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); i++; continue; }
    if (l.trim()) out.push(`<p>${inline(l)}</p>`);
    i++;

  return `<div class="md">${out.join('')}</div>`;
}

  $('dTitle').textContent = `Claude subagent · ${a.type}`;
  $('tabs').replaceChildren();
  $('dMeta').replaceChildren(tagEl('Claude', 'var(--claude)'), tagEl(a.stopped ? 'stopped' : 'running', a.stopped ? 'var(--dim)' : 'var(--working)'));
  const body = el('div', 'md');
  for (const [k, v] of [['Agent id', a.id], ['Type', a.type], ['Session', a.session || '?'], ['Started', a.started ? new Date(a.started).toLocaleString() : '?'],
    ['Stopped', a.stopped ? new Date(a.stopped).toLocaleString() : 'still running'], ['Elapsed', a.started ? dur((a.stopped || Date.now()) - a.started) : '?']]) {
    const r = el('div', 'lv-row'); r.append(el('b', '', k), el('span', '', v)); body.append(r);
  }
  body.append(el('p', 'hint', 'Claude subagents stream to Claude, not to a live file, so there is no text to show here.'));
  $('dBody').replaceChildren(body);
  showDrawer();
}
const closeDrawer = () => { closeLive(); renderTeam(); openId = null; $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); };
$('dClose').onclick = closeDrawer; $('scrim').onclick = closeDrawer;
addEventListener('keydown', (e) => e.key === 'Escape' && closeDrawer());
document.addEventListener('click', (e) => { const el = e.target.closest('.card[data-id],#feedList li[data-id]'); if (el) { openTab = 'reply'; openNote(el.dataset.id); } });

/* ---------- live stream ---------- */
function render() {
  renderStats(); renderMap(); renderFeed(); renderBoard();
  const n = openId && state.list.find((x) => x.id === openId);
  if (n && n.mtime !== openMtime) openNote(openId); // refresh the open note only when it changed
}
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('live').classList.remove('off'); $('liveTxt').textContent = 'live'; };
  es.onmessage = (e) => { state = JSON.parse(e.data); render(); };
  es.onerror = () => { $('live').classList.add('off'); $('liveTxt').textContent = 'reconnecting'; };
}
connect();
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString();
  document.querySelectorAll('[data-t]').forEach((e) => (e.textContent = ago(Number(e.dataset.t))));
  paintSeatStats();
}, 1000);
</script>
</body>
